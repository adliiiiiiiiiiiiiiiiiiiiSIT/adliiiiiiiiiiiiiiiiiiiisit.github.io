<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Project Template</title>
        <link rel="stylesheet" href="../style.css" />
    </head>
    <body>
        <header>
            <h1 id="name"></h1>
            <p id="title"></p>
        </header>

        <header>
            <div id="nav"></div>
        </header>

        <img id="project-banner">
        
        <section id="project-about">
            <h1 id="project-name"></h1>
            <h2>Summary</h2>
            <p id="project-summary"></p>
        </section>

        <section>
            <h1>My Contributions</h1>
            <p id="project-contributions"></p>
        </section>

        <section id="project-detail">
            <h2>Highlights</h2>
            <p id="project-highlights"></p>
        </section>

        <section id="project-gallery">
            <h2>Gallery</h2>
            <div class="gallery-container" id="gallery-list"></div>
        </section>

        <script src="../info.js"></script>
        <script src="../script.js"></script>
        <script>
            HeaderInfo.setHeaderInfo();
            Navigation.loadNavBar();

            const projectName = new URLSearchParams(window.location.search).get("project");
            ProjectPage.setProjectInfo(projectName);
        </script>
    </body>
</html>
